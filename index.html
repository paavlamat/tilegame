function wireZoomBadge(panel, view){
  const badge = panel.querySelector('[data-zoombadge]');
  if (!badge) return;
  let rafId = null;
  const tick = () => {
    rafId = requestAnimationFrame(tick);
    if (view.zoom > 1.001){
      badge.classList.add('on');
      badge.textContent = '⤢ ' + view.zoom.toFixed(1) + '× · reset';
    } else {
      badge.classList.remove('on');
    }
  };
  rafId = requestAnimationFrame(tick);
  badge.addEventListener('click', e => {
    e.stopPropagation();
    view.resetView();
    SFX.clickSoft();
  });
  badge.addEventListener('pointerdown', e => e.stopPropagation());
}

/* ══════════════════════════════════════════════════════════════
   INPUT — canvas
   ══════════════════════════════════════════════════════════════ */
function interactive(){
  return G.state === 'playing' && G.me && !G.me.done;
}
function bindCanvasInput(view, gameplay){
  const canvas = view.canvas;
  const pointers = new Map();
  let pinch = null;
  let touchGesture = null;
  let mousePan = null;

  const clientToLocal = (clientX, clientY) => {
    const rect = canvas.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top, rect };
  };

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => {
    if (!view.metrics) return;
    e.preventDefault();
    let delta = e.deltaY;
    if (e.deltaMode === 1) delta *= 16;
    else if (e.deltaMode === 2) delta *= 400;
    const factor = Math.exp(-delta * 0.0018);
    const newZoom = clamp(view.zoom * factor, 1, view.maxZoom);
    if (Math.abs(newZoom - view.zoom) < 0.001) return;
    const { x, y } = clientToLocal(e.clientX, e.clientY);
    view.zoomAround(x, y, newZoom);
  }, { passive: false });

  const cancelTouchGesture = () => {
    if (touchGesture && touchGesture.timer) clearTimeout(touchGesture.timer);
    touchGesture = null;
  };

  canvas.addEventListener('pointerdown', e => {
    if (!view.metrics) return;
    try { canvas.setPointerCapture(e.pointerId); } catch(err){}
    pointers.set(e.pointerId, {
      x: e.clientX, y: e.clientY,
      startX: e.clientX, startY: e.clientY,
      startTime: performance.now()
    });

    if (e.pointerType === 'mouse'){
      if (e.button === 1 || (e.button === 0 && e.shiftKey)){
        e.preventDefault();
        mousePan = { id: e.pointerId, lastX: e.clientX, lastY: e.clientY };
        return;
      }
      if (!gameplay || !interactive()) return;
      const cell = view.hitTest(e.clientX, e.clientY);
      if (!cell) return;
      e.preventDefault();
      if (e.button === 0)      localDigAt(cell.r, cell.c);
      else if (e.button === 2) localFlagAt(cell.r, cell.c);
      return;
    }

    if (pointers.size >= 2){
      cancelTouchGesture();
      const pts = Array.from(pointers.values());
      const d0 = Math.hypot(pts[0].startX - pts[1].startX, pts[0].startY - pts[1].startY);
      const midX0 = (pts[0].startX + pts[1].startX) / 2;
      const midY0 = (pts[0].startY + pts[1].startY) / 2;
      const l0 = clientToLocal(midX0, midY0);
      pinch = { d0, zoom0: view.zoom, pan0X: view.panX, pan0Y: view.panY, midL0X: l0.x, midL0Y: l0.y };
      return;
    }

    touchGesture = {
      id: e.pointerId, x0: e.clientX, y0: e.clientY,
      x: e.clientX, y: e.clientY,
      time0: performance.now(),
      moved: false, longFired: false, panning: false,
      lastX: e.clientX, lastY: e.clientY, timer: null
    };
    if (gameplay && interactive()){
      const g = touchGesture;
      const cx = e.clientX, cy = e.clientY;
      g.timer = setTimeout(() => {
        if (touchGesture !== g || g.moved || g.panning || !interactive()) return;
        g.longFired = true;
        const cell = view.hitTest(cx, cy);
        if (cell) localFlagAt(cell.r, cell.c);
        vibrate(20);
      }, 400);
    }
  });

  canvas.addEventListener('pointermove', e => {
    const tracked = pointers.get(e.pointerId);
    if (!tracked) return;
    tracked.x = e.clientX; tracked.y = e.clientY;

    if (mousePan && mousePan.id === e.pointerId){
      const dx = e.clientX - mousePan.lastX;
      const dy = e.clientY - mousePan.lastY;
      mousePan.lastX = e.clientX; mousePan.lastY = e.clientY;
      view.panBy(dx, dy);
      return;
    }
    if (pinch && pointers.size >= 2){
      const pts = Array.from(pointers.values());
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const cx = (pts[0].x + pts[1].x) / 2;
      const cy = (pts[0].y + pts[1].y) / 2;
      const l = clientToLocal(cx, cy);
      const newZoom = clamp(pinch.zoom0 * (d / Math.max(pinch.d0, 1)), 1, view.maxZoom);
      const w0x = (pinch.midL0X - pinch.pan0X) / pinch.zoom0;
      const w0y = (pinch.midL0Y - pinch.pan0Y) / pinch.zoom0;
      view.zoom = newZoom;
      view.panX = l.x - w0x * newZoom;
      view.panY = l.y - w0y * newZoom;
      if (view.zoom <= 1.0001) view.zoom = 1;
      view.clampPan();
      return;
    }
    if (touchGesture && touchGesture.id === e.pointerId){
      const dxTotal = e.clientX - touchGesture.x0;
      const dyTotal = e.clientY - touchGesture.y0;
      if (!touchGesture.moved && Math.hypot(dxTotal, dyTotal) > 8){
        touchGesture.moved = true;
        if (touchGesture.timer) clearTimeout(touchGesture.timer);
        if (view.zoom > 1.001){
          touchGesture.panning = true;
          touchGesture.lastX = e.clientX;
          touchGesture.lastY = e.clientY;
        }
      }
      if (touchGesture.panning){
        const pdx = e.clientX - touchGesture.lastX;
        const pdy = e.clientY - touchGesture.lastY;
        touchGesture.lastX = e.clientX;
        touchGesture.lastY = e.clientY;
        view.panBy(pdx, pdy);
      }
    }
  });

  const finishPointer = e => {
    if (mousePan && mousePan.id === e.pointerId) mousePan = null;
    if (touchGesture && touchGesture.id === e.pointerId){
      if (touchGesture.timer) clearTimeout(touchGesture.timer);
      const g = touchGesture;
      touchGesture = null;
      if (gameplay && interactive() && !g.moved && !g.longFired && !g.panning){
        const cell = view.hitTest(e.clientX, e.clientY);
        if (cell) localDigAt(cell.r, cell.c);
      }
    }
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 1){
      const [id, p] = pointers.entries().next().value;
      touchGesture = {
        id, x0: p.x, y0: p.y, x: p.x, y: p.y,
        time0: performance.now(),
        moved: true, longFired: true, panning: false,
        lastX: p.x, lastY: p.y, timer: null
      };
    }
  };

  canvas.addEventListener('pointerup', finishPointer);
  canvas.addEventListener('pointercancel', finishPointer);
}

/* ══════════════════════════════════════════════════════════════
   INPUT — keyboard
   ══════════════════════════════════════════════════════════════ */
const heldPan = { w:false, a:false, s:false, d:false };

window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const k = e.key.toLowerCase();

  if (k === 'w' || k === 'a' || k === 's' || k === 'd'){
    const hasReview = G.reviewViews && G.reviewViews.length > 0;
    if (hasReview || (G.viewMe && G.state !== 'lobby')){
      heldPan[k] = true;
      e.preventDefault();
    }
    return;
  }

  if (G.state !== 'playing' || !G.me) return;
  let handled = true;
  switch (k){
    case 'arrowup':    moveCursor(-1, 0); break;
    case 'arrowdown':  moveCursor(1, 0);  break;
    case 'arrowleft':  moveCursor(0, -1); break;
    case 'arrowright': moveCursor(0, 1);  break;
    case ' ':
      if (!e.repeat) localDig();
      break;
    case 'f':
      if (!e.repeat) localFlag();
      break;
    case 'e': case 'q':
      if (!e.repeat) localChord();
      break;
    case '0':
      if (G.viewMe) G.viewMe.resetView();
      break;
    default:
      handled = false;
  }
  if (handled) e.preventDefault();
}, { passive:false });

window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'a' || k === 's' || k === 'd') heldPan[k] = false;
});
window.addEventListener('blur', () => {
  heldPan.w = heldPan.a = heldPan.s = heldPan.d = false;
});

function updatePanFromKeys(dtMs){
  const targets = (G.reviewViews && G.reviewViews.length)
    ? G.reviewViews
    : (G.viewMe ? [G.viewMe] : []);
  if (!targets.length) return;
  let dx = 0, dy = 0;
  if (heldPan.a) dx += 1;
  if (heldPan.d) dx -= 1;
  if (heldPan.w) dy += 1;
  if (heldPan.s) dy -= 1;
  if (!dx && !dy) return;
  const dt = dtMs / 1000;
  for (const v of targets){
    if (v && v.metrics && v.zoom > 1.0001){
      v.panBy(dx * PAN_SPEED_CSS * dt, dy * PAN_SPEED_CSS * dt);
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   INPUT — touch pad
   ══════════════════════════════════════════════════════════════ */
function holdButton(btn, fn){
  let t1 = null, t2 = null;
  const start = e => {
    e.preventDefault();
    if (!interactive()) return;
    fn();
    t1 = setTimeout(() => { t2 = setInterval(() => { if (interactive()) fn(); }, 110); }, 320);
  };
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
}
function buildTouchpad(){
  const pad = document.createElement('div');
  pad.className = 'touchpad';
  pad.innerHTML =
    '<div class="dpad">' +
      '<button class="u ghost" data-mv="up">▲</button>' +
      '<button class="l ghost" data-mv="left">◀</button>' +
      '<button class="r ghost" data-mv="right">▶</button>' +
      '<button class="dn ghost" data-mv="down">▼</button>' +
    '</div>' +
    '<div class="tp-actions">' +
      '<button class="primary" data-act="dig">DIG ⛏</button>' +
      '<button data-act="flag">FLAG ⚑</button>' +
    '</div>';
  const map = {
    up:    () => moveCursor(-1, 0),
    down:  () => moveCursor(1, 0),
    left:  () => moveCursor(0, -1),
    right: () => moveCursor(0, 1)
  };
  pad.querySelectorAll('[data-mv]').forEach(b => holdButton(b, map[b.dataset.mv]));
  pad.querySelector('[data-act="dig"]').addEventListener('click', () => localDig());
  pad.querySelector('[data-act="flag"]').addEventListener('click', () => localFlag());
  return pad;
}

/* ══════════════════════════════════════════════════════════════
   GAME LOGIC
   ══════════════════════════════════════════════════════════════ */
function applyReveal(boardState, board, r, c, owner){
  owner = owner || 0;
  if (boardState.revealed[r][c]) return null;
  if (boardState.flagged[r][c]){
    boardState.flagged[r][c] = false;
    boardState.flagCount = Math.max(0, boardState.flagCount - 1);
  }
  if (board.mines.has(r + ',' + c)){
    boardState.revealed[r][c] = true;
    boardState.revealAt[r][c] = performance.now();
    if (boardState.owner) boardState.owner[r][c] = 0;
    boardState.count++;
    return { type: 'mine', tiles: [[r, c]] };
  }
  const now = performance.now();
  const queue = [[r, c, 0]];
  const seen = new Set([r + ',' + c]);
  const tiles = [];
  while (queue.length){
    const item = queue.shift();
    const cr = item[0], cc = item[1], d = item[2];
    if (boardState.revealed[cr][cc]) continue;
    if (boardState.flagged[cr][cc]){
      boardState.flagged[cr][cc] = false;
      boardState.flagCount = Math.max(0, boardState.flagCount - 1);
    }
    boardState.revealed[cr][cc] = true;
    if (owner && boardState.owner) boardState.owner[cr][cc] = owner;
    boardState.revealAt[cr][cc] = now + Math.min(d, 14) * 24;
    boardState.count++;
    boardState.safeRevealed++;
    tiles.push([cr, cc]);
    if (board.adj[cr][cc] === 0){
      for (const nb of board.neighbors(cr, cc, board.rows, board.cols)){
        const nr = nb[0], nc = nb[1];
        const k = nr + ',' + nc;
        if (!seen.has(k) && !boardState.revealed[nr][nc]){
          seen.add(k);
          queue.push([nr, nc, d + 1]);
        }
      }
    }
  }
  return { type: 'ok', tiles };
}

function applyChord(boardState, board, r, c, owner){
  if (!boardState.revealed[r][c]) return null;
  if (board.adj[r][c] <= 0) return null;
  const nbs = board.neighbors(r, c, board.rows, board.cols);
  let flags = 0;
  for (const nb of nbs){
    const nr = nb[0], nc = nb[1];
    if (boardState.flagged[nr][nc]) flags++;
    else if (boardState.revealed[nr][nc] && board.mines.has(nr + ',' + nc)) flags++;
  }
  if (flags !== board.adj[r][c]) return null;
  for (const nb of nbs){
    const nr = nb[0], nc = nb[1];
    if (boardState.flagged[nr][nc] || boardState.revealed[nr][nc]) continue;
    if (board.mines.has(nr + ',' + nc)){
      const res = applyReveal(boardState, board, nr, nc, owner);
      return { type: 'mine', tiles: res ? res.tiles : [[nr, nc]] };
    }
  }
  const allTiles = [];
  for (const nb of nbs){
    const nr = nb[0], nc = nb[1];
    if (boardState.flagged[nr][nc] || boardState.revealed[nr][nc]) continue;
    const res = applyReveal(boardState, board, nr, nc, owner);
    if (res && res.tiles) allTiles.push.apply(allTiles, res.tiles);
  }
  return { type: 'ok', tiles: allTiles };
}

function revealAllMines(boardState, board, originR, originC){
  const now = performance.now();
  for (let r = 0; r < board.rows; r++){
    for (let c = 0; c < board.cols; c++){
      if (!board.mines.has(r + ',' + c)) continue;
      if (boardState.revealed[r][c] || boardState.flagged[r][c]) continue;
      const d = Math.hypot(r - originR, c - originC);
      boardState.revealed[r][c] = true;
      if (boardState.owner) boardState.owner[r][c] = 0;
      boardState.revealAt[r][c] = now + d * 35;
    }
  }
}
function checkWin(boardState, board){ return boardState.safeRevealed >= board.safeCount; }
function countLand(boardState, owner){
  let n = 0;
  if (!boardState.owner) return 0;
  for (let r = 0; r < boardState.rows; r++)
    for (let c = 0; c < boardState.cols; c++)
      if (boardState.owner[r][c] === owner) n++;
  return n;
}
function canTouchTerritoryRaw(boardState, board, r, c, owner){
  if (!boardState || !boardState.owner || !board) return true;
  if (boardState.owner[r][c] === owner) return true;
  for (const [nr, nc] of board.neighbors(r, c, board.rows, board.cols)){
    if (boardState.owner[nr][nc] === owner) return true;
  }
  return false;
}
function canTouchTerritory(boardState, board, r, c, owner){
  if (G.territoryUnlocked) return true;
  return canTouchTerritoryRaw(boardState, board, r, c, owner);
}
function hasAvailableMove(boardState, board, owner){
  if (!boardState || !board || !boardState.owner) return true;
  for (let r = 0; r < board.rows; r++){
    for (let c = 0; c < board.cols; c++){
      if (boardState.revealed[r][c]) continue;
      if (boardState.flagged[r][c]) continue;
      if (canTouchTerritoryRaw(boardState, board, r, c, owner)) return true;
    }
  }
  return false;
}

function findSafeSwapTarget(board, boardState, r, c){
  const { rows, cols } = board;
  const candidates = [];
  for (let dr = -4; dr <= 4; dr++){
    for (let dc = -4; dc <= 4; dc++){
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      if (board.mines.has(nr + ',' + nc)) continue;
      if (boardState && boardState.revealed[nr][nc]) continue;
      candidates.push({ r: nr, c: nc });
    }
  }
  if (!candidates.length) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}
function ensureFirstDigSafe(board, boardState, playerState, r, c, syncNetwork){
  if (!playerState || playerState.digged) return false;
  playerState.digged = true;
  if (!board.mines.has(r + ',' + c)) return false;
  const swap = findSafeSwapTarget(board, boardState, r, c);
  if (!swap) return false;
  board.mines.delete(r + ',' + c);
  board.mines.add(swap.r + ',' + swap.c);
  recomputeAdjacency(board);
  if (syncNetwork) send({ t:'swapmine', r, c, sr: swap.r, sc: swap.c });
  return true;
}

/* ══════════════════════════════════════════════════════════════
   LOCAL ACTIONS
   ══════════════════════════════════════════════════════════════ */
function canAct(){
  return G.state === 'playing' && G.me && !G.me.done && performance.now() >= G.me.stunUntil;
}
function isFrozen(){ return G.me && performance.now() < G.me.stunUntil; }

let lastCursorSent = 0;
function sendCursor(){
  if (G.role === 'solo' || !G.conn) return;
  const now = performance.now();
  if (now - lastCursorSent < 110) return;
  lastCursorSent = now;
  send({ t:'cur', r: G.me.cursor.r, c: G.me.cursor.c });
}
function moveCursor(dr, dc){
  if (G.state !== 'playing' || !G.me || G.me.done) return;
  if (isFrozen()) return;
  const rows = G.board.rows, cols = G.board.cols;
  const nr = clamp(G.me.cursor.r + dr, 0, rows - 1);
  const nc = clamp(G.me.cursor.c + dc, 0, cols - 1);
  if (nr === G.me.cursor.r && nc === G.me.cursor.c) return;
  G.me.cursor = { r: nr, c: nc };
  sendCursor();
}
function localDigAt(r, c){ if (!canAct()) return; G.me.cursor = { r, c }; localDig(); }
function localFlagAt(r, c){ if (!canAct()) return; G.me.cursor = { r, c }; localFlag(); }
function localChordAt(r, c){ if (!canAct()) return; G.me.cursor = { r, c }; localChord(); }

function localDig(){
  if (!canAct()) return;
  const r = G.me.cursor.r, c = G.me.cursor.c;
  const mode = G.config.mode;

  if (G.myBoard.flagged[r][c]){ localFlag(); return; }
  if (mode === 'territory' && !canTouchTerritory(G.myBoard, G.board, r, c, G.myOwner)) return;

  if (G.boardPending){
    if (mode === 'solo'){
      ensureBoardReady(r, c);
    } else if (mode === 'duel'){
      ensureBoardReady(r, c);
      send({ t:'layout', mines: Array.from(G.board.mines) });
    } else {
      if (G.role === 'host'){
        ensureBoardReady(r, c);
        send({ t:'board', seed: G.boardSeed, clickR: r, clickC: c });
      } else {
        send({ t:'dig', r, c });
        G.pendingDig = { r, c };
        return;
      }
    }
  }
  doLocalDig(r, c);
}
function doLocalDig(r, c){
  const mode = G.config.mode;
  if (mode === 'coop' || mode === 'territory'){
    if (G.role === 'host') hostApplyDig(r, c, G.myOwner);
    else send({ t:'dig', r, c });
    return;
  }
  if (mode === 'duel'){
    const bs = G.myBoard;
    ensureFirstDigSafe(G.board, bs, G.me, r, c, true);
    const res = applyReveal(bs, G.board, r, c, 0);
    if (!res) return;
    if (res.type === 'mine'){
      G.me.hits++; G.deathTile = { r, c };
      send({ t:'hit', r, c });
      duelFreeze(r, c);
      return;
    }
    send({ t:'rev', tiles: res.tiles });
    afterRevealFeedback(res);
    if (checkWin(bs, G.board)) duelWin();
    return;
  }
  /* solo */
  const bs = G.myBoard;
  ensureFirstDigSafe(G.board, bs, G.me, r, c, false);
  const res = applyReveal(bs, G.board, r, c, 0);
  if (!res) return;
  if (res.type === 'mine'){
    G.me.hits++;
    handleLoss(r, c, G.viewMe, bs, G.board);
    return;
  }
  afterRevealFeedback(res);
  if (checkWin(bs, G.board)){
    G.me.done = true;
    endGame('win', '✨', 'CLEARED!', 'You swept every safe tile.', performance.now() - G.startTime);
  }
}
function afterRevealFeedback(res){
  if (!res || !res.tiles || res.tiles.length === 0) return;
  const r0 = res.tiles[0][0], c0 = res.tiles[0][1];
  const val = G.board.adj[r0][c0];
  SFX.reveal(val);
}
function handleLoss(r, c, view, bs, board){
  if (G.lossPending) return;
  G.lossPending = true; G.me.done = true;
  G.deathTile = { r, c };
  if (view){
    view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', 40, 280);
    view.boom(p.x, p.y, '#ffd166', 18, 150);
  }
  SFX.mine(); vibrate(180);
  revealAllMines(bs, board, r, c);
  const elapsed = performance.now() - G.startTime;
  setTimeout(() => {
    endGame('lose', '💥', 'BOOM!', 'You hit a mine. The field is lost.', elapsed);
    G.lossPending = false;
  }, 1000);
}
function handleCoopLoss(r, c, broadcast, iTriggered){
  if (iTriggered === undefined) iTriggered = true;
  if (G.lossPending) return;
  G.lossPending = true;
  if (G.me) G.me.done = true;
  G.deathTile = { r, c };
  const bs = G.myBoard;
  const view = G.viewMe;
  if (view){
    if (iTriggered) view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', 40, 280);
    view.boom(p.x, p.y, '#ffd166', 18, 150);
  }
  if (iTriggered){ SFX.mine(); vibrate(180); } else { SFX.oppStun(); }
  revealAllMines(bs, G.board, r, c);
  if (broadcast){
    send({ t:'delta', lose:true, r, c, by: iTriggered ? G.myOwner : G.theirOwner });
  }
  const elapsed = performance.now() - G.startTime;
  setTimeout(() => {
    endGame('lose', '💥', 'BOOM!', 'A mine was triggered. The field is lost.', elapsed);
    G.lossPending = false;
  }, 1000);
}
function duelFreeze(r, c){
  const now = performance.now();
  G.me.stunUntil = now + STUN_MS;
  G.me.wasStunned = true;
  G.me.stunReason = 'bomb';
  const view = G.viewMe;
  if (view){
    view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', 36, 260);
    view.boom(p.x, p.y, '#ffd166', 16, 140);
  }
  SFX.mine();
  setTimeout(() => SFX.freeze(), 150);
  vibrate(160);
}
function duelWin(){
  if (G.winSent) return;
  G.winSent = true; G.me.done = true;
  send({ t:'win' });
  const elapsed = performance.now() - G.startTime;
  endGame('win', '🏆', 'VICTORY!', 'You cleared your field first.', elapsed);
}
function applyPenalty(ownerId, reason){
  const now = performance.now();
  const r = reason || 'bomb';
  if (ownerId === G.myOwner){
    G.me.hits++;
    G.me.stunUntil = now + STUN_MS;
    G.me.wasStunned = true;
    G.me.stunReason = r;
    if (r === 'flag'){ SFX.freeze(); }
    else { SFX.mine(); setTimeout(() => SFX.freeze(), 150); }
    vibrate(160);
  } else if (G.them){
    G.them.hits++;
    G.them.stunUntil = now + STUN_MS;
    G.them.wasStunned = true;
    G.them.stunReason = r;
    SFX.oppStun();
  }
  send({ t:'stun', who: ownerId, reason: r });
}
function handleTerritoryBoom(r, c, owner){
  const bs = G.myBoard;
  const iTriggered = (owner === G.myOwner);
  if (iTriggered) G.deathTile = { r, c };
  if (bs){
    if (bs.owner) bs.owner[r][c] = owner;
    if (!bs.revealed[r][c]){
      bs.revealed[r][c] = true;
      bs.revealAt[r][c] = performance.now();
      bs.count++;
    }
  }
  applyPenalty(owner, 'bomb');
  const view = G.viewMe;
  if (view){
    if (iTriggered) view.triggerShake();
    const p = hexOrSqCenter(view, r, c);
    view.boom(p.x, p.y, '#ff4d6d', iTriggered ? 40 : 24, iTriggered ? 280 : 180);
    view.boom(p.x, p.y, '#ffd166', iTriggered ? 18 : 10, 140);
  }
  send({ t:'delta', mine:[r, c], own: owner, rev: [[r, c]] });
}
function afterSharedReveal(){
  if (G.config.mode === 'coop'){
    if (checkWin(G.myBoard, G.board)){
      send({ t:'win' });
      endGame('win', '🎉', 'FIELD CLEARED!', 'Together you swept every safe tile.', performance.now() - G.startTime);
    }
  } else if (G.config.mode === 'territory'){
    if (checkWin(G.myBoard, G.board)){ finishTerritory(); return; }
    checkTerritoryUnlock();
  }
}
function finishTerritory(){
  if (G.state === 'over') return;
  const mine   = countLand(G.myBoard, G.myOwner);
  const theirs = countLand(G.myBoard, G.theirOwner);
  const total  = G.board.safeCount;
  let result, icon, title, sub;
  if (mine > theirs){
    result = 'win';  icon = '🏆'; title = 'LAND GRAB WON!';
    sub = 'You claimed <b style="color:#4dd8ff">' + mine + '</b> tiles — opponent got <b style="color:#ff3d81">' + theirs + '</b>.';
  } else if (theirs > mine){
    result = 'lose'; icon = '💀'; title = 'LAND GRAB LOST';
    sub = 'Opponent claimed <b style="color:#ff3d81">' + theirs + '</b> tiles — you got <b style="color:#4dd8ff">' + mine + '</b>.';
  } else {
    result = 'draw'; icon = '🤝'; title = 'DEAD EVEN';
    sub = 'Both players claimed <b>' + mine + '</b> tiles.';
  }
  const cards =
    '<div class="statcard win"><div class="slabel">YOUR LAND</div><div class="sval">' + mine + '</div></div>' +
    '<div class="statcard lose"><div class="slabel">THEIR LAND</div><div class="sval">' + theirs + '</div></div>' +
    '<div class="statcard"><div class="slabel">TOTAL</div><div class="sval">' + total + '</div></div>';
  endGame(result, icon, title, sub, performance.now() - G.startTime, cards);
}
function localFlag(){
  if (!canAct()) return;
  const r = G.me.cursor.r, c = G.me.cursor.c;
  const bs = G.myBoard;
  if (bs.revealed[r][c]) return;
  const mode = G.config.mode;
  if (mode === 'territory'){
    if (!canTouchTerritory(bs, G.board, r, c, G.myOwner)) return;
    if (G.role === 'host') hostApplyTerritoryFlag(r, c, G.myOwner);
    else {
      bs.flagged[r][c] ? SFX.unflag() : SFX.flag();
      send({ t:'flag', r, c });
    }
    return;
  }
  if (mode === 'coop'){
    if (G.role === 'host') hostApplyFlag(r, c);
    else {
      bs.flagged[r][c] ? SFX.unflag() : SFX.flag();
      send({ t:'flag', r, c });
    }
    return;
  }
  const on = bs.flagged[r][c] ? 0 : 1;
  bs.flagged[r][c] = !!on;
  bs.flagAt[r][c] = performance.now();
  bs.flagCount += on ? 1 : -1;
  on ? SFX.flag() : SFX.unflag();
  if (mode === 'duel') send({ t:'flag', r, c, on });
}
function localChord(){
  if (!canAct()) return;
  const r = G.me.cursor.r, c = G.me.cursor.c;
  const mode = G.config.mode;
  if (mode === 'coop' || mode === 'territory'){
    if (mode === 'territory' && !canTouchTerritory(G.myBoard, G.board, r, c, G.myOwner)) return;
    if (G.role === 'host') hostApplyChord(r, c, G.myOwner);
    else send({ t:'chord', r, c });
    return;
  }
  if (mode === 'duel'){
    const bs = G.myBoard;
    const res = applyChord(bs, G.board, r, c, 0);
    if (!res) return;
    if (res.type === 'mine'){
      G.me.hits++;
      const mr = res.tiles[0][0], mc = res.tiles[0][1];
      G.deathTile = { r: mr, c: mc };
      send({ t:'hit', r: mr, c: mc });
      duelFreeze(mr, mc);
      return;
    }
    send({ t:'rev', tiles: res.tiles });
    afterRevealFeedback(res);
    if (checkWin(bs, G.board)) duelWin();
    return;
  }
  const bs = G.myBoard;
  const res = applyChord(bs, G.board, r, c, 0);
  if (!res) return;
  if (res.type === 'mine'){
    G.me.hits++;
    handleLoss(res.tiles[0][0], res.tiles[0][1], G.viewMe, bs, G.board);
    return;
  }
  afterRevealFeedback(res);
  if (checkWin(bs, G.board)){
    G.me.done = true;
    endGame('win', '✨', 'CLEARED!', 'You swept every safe tile.', performance.now() - G.startTime);
  }
}

/* ══════════════════════════════════════════════════════════════
   TERRITORY UNLOCK
   ══════════════════════════════════════════════════════════════ */
function checkTerritoryUnlock(){
  if (G.config.mode !== 'territory') return;
  if (G.territoryUnlocked) return;
  if (G.state !== 'playing') return;
  if (G.role !== 'host' && G.role !== 'solo') return;
  if (!G.myBoard || !G.board) return;
  const myBlocked    = !hasAvailableMove(G.myBoard, G.board, G.myOwner);
  const theirBlocked = !hasAvailableMove(G.myBoard, G.board, G.theirOwner);
  if (!myBlocked && !theirBlocked) return;
  G.territoryUnlocked = true;
  const byOwner = myBlocked ? G.myOwner : G.theirOwner;
  send({ t:'unlock', by: byOwner });
  showUnlockPopup(byOwner);
}
function showUnlockPopup(byOwner){
  const prev = document.querySelector('.terr-unlock');
  if (prev) prev.remove();
  const meBlocked = (byOwner === G.myOwner);
  const who = meBlocked
    ? '<b>You</b> have no legal moves left.'
    : '<i>Your opponent</i> has no legal moves left.';
  const el = document.createElement('div');
  el.className = 'terr-unlock';
  el.innerHTML =
    '<div class="terr-unlock-box">' +
      '<div class="terr-unlock-icon">🔓</div>' +
      '<div class="terr-unlock-title">TERRITORY OPENED</div>' +
      '<div class="terr-unlock-body">' + who +
        '<br>All remaining tiles can now be claimed by either player.' +
      '</div>' +
    '</div>';
  document.body.appendChild(el);
  SFX.unlock();
  vibrate([40, 60, 40]);
  setTimeout(() => {
    el.classList.add('fade');
    setTimeout(() => el.remove(), 700);
  }, 3600);
}

/* ══════════════════════════════════════════════════════════════
   HOST-AUTHORITATIVE SHARED ACTIONS
   ══════════════════════════════════════════════════════════════ */
function hostApplyDig(r, c, owner){
  const bs = G.myBoard;
  const isMyDig = (owner === G.myOwner);
  const who = isMyDig ? G.me : G.them;
  if (who && ensureFirstDigSafe(G.board, bs, who, r, c, true)){}
  if (bs.flagged[r][c]){
    if (G.config.mode === 'territory') hostApplyTerritoryFlag(r, c, owner);
    else hostApplyFlag(r, c);
    return;
  }
  const res = applyReveal(bs, G.board, r, c, owner);
  if (!res) return;
  if (res.type === 'mine'){
    if (G.config.mode === 'coop') handleCoopLoss(r, c, true, owner === G.myOwner);
    else handleTerritoryBoom(r, c, owner);
    return;
  }
  send({ t:'delta', rev: res.tiles, own: owner });
  afterRevealFeedback(res);
  afterSharedReveal();
}
function hostApplyFlag(r, c){
  const bs = G.myBoard;
  if (bs.revealed[r][c]) return;
  const on = bs.flagged[r][c] ? 0 : 1;
  bs.flagged[r][c] = !!on;
  bs.flagAt[r][c] = performance.now();
  bs.flagCount += on ? 1 : -1;
  send({ t:'delta', flg: [[r, c, on]] });
  on ? SFX.flag() : SFX.unflag();
}
function hostApplyTerritoryFlag(r, c, owner){
  const bs = G.myBoard;
  if (bs.revealed[r][c]) return;
  if (bs.flagged[r][c]){
    bs.flagged[r][c] = false;
    bs.flagAt[r][c] = performance.now();
    bs.flagCount = Math.max(0, bs.flagCount - 1);
    if (bs.owner && bs.owner[r][c] === owner) bs.owner[r][c] = 0;
    send({ t:'delta', flg: [[r, c, 0]], own: 0 });
    SFX.unflag();
    checkTerritoryUnlock();
    return;
  }
  const isMine = G.board.mines.has(r + ',' + c);
  if (isMine){
    bs.flagged[r][c] = true;
    bs.flagAt[r][c] = performance.now();
    bs.flagCount++;
    if (bs.owner) bs.owner[r][c] = owner;
    send({ t:'delta', flg: [[r, c, 1]], own: owner });
    SFX.flag();
    checkTerritoryUnlock();
  } else {
    bs.revealed[r][c] = true;
    bs.revealAt[r][c] = performance.now();
    if (bs.owner) bs.owner[r][c] = owner;
    bs.count++;
    bs.safeRevealed++;
    send({ t:'delta', rev: [[r, c]], own: owner });
    const view = G.viewMe;
    if (view){
      const p = hexOrSqCenter(view, r, c);
      if (owner === G.myOwner) view.triggerShake();
      view.boom(p.x, p.y, '#7fd8ff', 18, 160);
    }
    applyPenalty(owner, 'flag');
    if (checkWin(bs, G.board)){ finishTerritory(); return; }
    checkTerritoryUnlock();
  }
}
function hostApplyChord(r, c, owner){
  const bs = G.myBoard;
  const res = applyChord(bs, G.board, r, c, owner);
  if (!res) return;
  if (res.type === 'mine'){
    const mr = res.tiles[0][0], mc = res.tiles[0][1];
    if (G.config.mode === 'coop') handleCoopLoss(mr, mc, true, owner === G.myOwner);
    else handleTerritoryBoom(mr, mc, owner);
    return;
  }
  send({ t:'delta', rev: res.tiles, own: owner });
  afterRevealFeedback(res);
  afterSharedReveal();
}

/* ══════════════════════════════════════════════════════════════
   NETWORK
   ══════════════════════════════════════════════════════════════ */
function send(msg){
  if (G.conn && G.conn.open){
    try { G.conn.send(msg); } catch(e){}
  }
}
let hbTimer = null;
function startHeartbeat(){
  stopHeartbeat();
  hbTimer = setInterval(() => {
    if (G.state === 'lobby' && !G.conn) return;
    if (!G.conn || !G.conn.open){ onConnClosed(); return; }
    if (G.lastRecv && (performance.now() - G.lastRecv) > HEARTBEAT_TIMEOUT){
      onConnClosed(); return;
    }
    send({ t:'ping' });
  }, HEARTBEAT_MS);
}
function stopHeartbeat(){ if (hbTimer){ clearInterval(hbTimer); hbTimer = null; } }

function onConnClosed(){
  stopHeartbeat();
  if (G.opponentGone) return;
  G.opponentGone = true;
  if (G.state === 'playing' || G.state === 'countdown'){
    endGame('disconnect', '🔌', 'OPPONENT DISCONNECTED',
            'Your opponent left the match.', performance.now() - G.startTime);
  } else if (G.state === 'over'){
    cleanupNet();
  } else {
    cleanupNet();
    idleOverlay();
  }
}
function attachConn(c){
  G.conn = c;
  G.lastRecv = performance.now();
  G.opponentGone = false;
  c.on('data', msg => { G.lastRecv = performance.now(); handleMessage(msg); });
  c.on('close', onConnClosed);
  c.on('error', () => {});
  startHeartbeat();
}

function handleMessage(msg){
  if (!msg || typeof msg !== 'object') return;
  switch (msg.t){
    case 'ping': break;
    case 'bye': onConnClosed(); break;

    case 'seed':
      G.config = msg.config || G.config;
      G.mySeed = (msg.seedHost >>> 0) || newSeed();
      G.theirSeed = (msg.seedGuest >>> 0) || newSeed();
      G.seed = G.mySeed;
      startMatch(msg.seedHost >>> 0, 'guest');
      break;

    case 'cur':
      if (G.them) G.them.cursor = { r: msg.r, c: msg.c };
      break;

    case 'layout':
      if (G.config.mode !== 'duel') break;
      if (!G.theirBoardLayout) break;
      rebuildBoardFromMines(G.theirBoardLayout, msg.mines || [], G.config.style);
      break;

    case 'board': {
      if (G.config.mode !== 'coop') break;
      if (!G.boardPending) break;
      const d = dimsFor(G.config);
      G.board = genBoardDeferred(msg.seed, G.config.style, d.cols, d.rows, d.mines,
                                 msg.clickR, msg.clickC,
                                 [{ r: (d.rows >> 1), c: (d.cols >> 1) }]);
      G.boardSeed = msg.seed;
      G.boardPending = false;
      if (G.pendingDig){
        const pd = G.pendingDig;
        G.pendingDig = null;
        G.me.cursor = { r: pd.r, c: pd.c };
        setTimeout(() => { if (G.state === 'playing') doLocalDig(pd.r, pd.c); }, 0);
      }
      break;
    }

    case 'dig': {
      if (G.role !== 'host') break;
      if (G.config.mode !== 'coop' && G.config.mode !== 'territory') break;
      if (performance.now() < G.them.stunUntil) break;
      if (G.config.mode === 'territory' &&
          !canTouchTerritory(G.myBoard, G.board, msg.r, msg.c, G.theirOwner)) break;
      if (G.boardPending){
        ensureBoardReady(msg.r, msg.c);
        send({ t:'board', seed: G.boardSeed, clickR: msg.r, clickC: msg.c });
      }
      hostApplyDig(msg.r, msg.c, G.theirOwner);
      break;
    }

    case 'flag':
      if (G.config.mode === 'coop'){
        if (G.role !== 'host') break;
        if (performance.now() < G.them.stunUntil) break;
        hostApplyFlag(msg.r, msg.c);
      } else if (G.config.mode === 'territory'){
        if (G.role !== 'host') break;
        if (performance.now() < G.them.stunUntil) break;
        if (!canTouchTerritory(G.myBoard, G.board, msg.r, msg.c, G.theirOwner)) break;
        hostApplyTerritoryFlag(msg.r, msg.c, G.theirOwner);
      } else if (G.config.mode === 'duel'){
        if (!G.theirBoard) break;
        const on = msg.on ? 1 : 0;
        if (G.theirBoard.flagged[msg.r][msg.c] !== !!on){
          G.theirBoard.flagged[msg.r][msg.c] = !!on;
          G.theirBoard.flagAt[msg.r][msg.c] = performance.now();
          G.theirBoard.flagCount += on ? 1 : -1;
        }
      }
      break;

    case 'chord':
      if (G.role !== 'host') break;
      if (G.config.mode !== 'coop' && G.config.mode !== 'territory') break;
      if (performance.now() < G.them.stunUntil) break;
      if (G.config.mode === 'territory' &&
          !canTouchTerritory(G.myBoard, G.board, msg.r, msg.c, G.theirOwner)) break;
      if (G.boardPending){
        ensureBoardReady(msg.r, msg.c);
        send({ t:'board', seed: G.boardSeed, clickR: msg.r, clickC: msg.c });
      }
      hostApplyChord(msg.r, msg.c, G.theirOwner);
      break;

    case 'rev':
      if (!G.theirBoard) break;
      {
        const now = performance.now();
        const layout = G.theirBoardLayout || G.board;
        for (const pair of (msg.tiles || [])){
          const r = pair[0], c = pair[1];
          if (G.theirBoard.revealed[r][c]) continue;
          G.theirBoard.revealed[r][c] = true;
          G.theirBoard.revealAt[r][c] = now + Math.random() * 80;
          G.theirBoard.count++;
          if (layout && !layout.mines.has(r + ',' + c)) G.theirBoard.safeRevealed++;
        }
      }
      break;

    case 'hit':
      if (G.them){
        G.them.hits++;
        G.them.stunUntil = performance.now() + STUN_MS;
        G.them.wasStunned = true;
        G.them.stunReason = 'bomb';
      }
      G.theirDeathTile = { r: msg.r, c: msg.c };
      if (G.theirBoard && msg.r !== undefined && msg.c !== undefined){
        const now = performance.now();
        if (!G.theirBoard.revealed[msg.r][msg.c]){
          G.theirBoard.revealed[msg.r][msg.c] = true;
          G.theirBoard.revealAt[msg.r][msg.c] = now;
          G.theirBoard.count++;
        }
      }
      if (G.viewThem) G.viewThem.triggerShake();
      SFX.oppStun();
      break;

    case 'swapmine': {
      const layout = (G.config.mode === 'duel') ? G.theirBoardLayout : G.board;
      if (!layout) break;
      if (layout.mines.has(msg.r + ',' + msg.c)){
        layout.mines.delete(msg.r + ',' + msg.c);
        layout.mines.add(msg.sr + ',' + msg.sc);
        recomputeAdjacency(layout);
      }
      break;
    }

    case 'delta': applyDelta(msg); break;

    case 'unlock':
      if (G.config.mode === 'territory' && !G.territoryUnlocked){
        G.territoryUnlocked = true;
        showUnlockPopup(msg.by === undefined ? G.theirOwner : msg.by);
      }
      break;

    case 'stun': {
      const now = performance.now();
      const reason = msg.reason || 'bomb';
      if (msg.who === G.myOwner){
        G.me.hits++;
        G.me.stunUntil = now + STUN_MS;
        G.me.wasStunned = true;
        G.me.stunReason = reason;
        if (reason === 'flag'){ SFX.freeze(); }
        else { SFX.mine(); setTimeout(() => SFX.freeze(), 150); }
        vibrate(160);
      } else if (G.them){
        G.them.hits++;
        G.them.stunUntil = now + STUN_MS;
        G.them.wasStunned = true;
        G.them.stunReason = reason;
        SFX.oppStun();
      }
      break;
    }

    case 'win':
      if (G.state === 'playing' || G.state === 'countdown'){
        if (G.config.mode === 'coop'){
          endGame('win', '🎉', 'FIELD CLEARED!',
            'Together you swept every safe tile.',
            performance.now() - G.startTime);
        } else {
          endGame('lose', '💀', 'DEFEATED',
            'Your opponent cleared their field first.',
            performance.now() - G.startTime);
        }
      }
      break;

    case 'lose':
      if (G.state === 'playing' || G.state === 'countdown'){
        endGame('win', '🏆', 'VICTORY!',
          'Your opponent triggered a mine.',
          performance.now() - G.startTime);
      }
      break;
  }
}

function applyDelta(msg){
  const bs = G.myBoard;
  if (!bs || !G.board) return;
  const now = performance.now();
  if (msg.rev){
    for (const pair of msg.rev){
      const r = pair[0], c = pair[1];
      if (bs.revealed[r][c]) continue;
      bs.revealed[r][c] = true;
      bs.revealAt[r][c] = now + Math.random() * 70;
      bs.count++;
      if (!G.board.mines.has(r + ',' + c)) bs.safeRevealed++;
      if (msg.own !== undefined && bs.owner) bs.owner[r][c] = msg.own ? msg.own : 0;
    }
  }
  if (msg.flg){
    for (const tri of msg.flg){
      const r = tri[0], c = tri[1], on = tri[2];
      const wasOn = bs.flagged[r][c] ? 1 : 0;
      bs.flagged[r][c] = !!on;
      bs.flagAt[r][c] = now;
      bs.flagCount += on - wasOn;
      if (bs.owner){
        if (on && msg.own !== undefined) bs.owner[r][c] = msg.own ? msg.own : 0;
        else if (!on) bs.owner[r][c] = 0;
      }
    }
  }
  if (msg.mine && bs.owner){
    const r = msg.mine[0], c = msg.mine[1];
    bs.owner[r][c] = (msg.own !== undefined) ? msg.own : 0;
  }
  if (msg.lose){
    handleCoopLoss(msg.r, msg.c, false, msg.by === G.myOwner);
  }
}

function cleanupNet(){
  stopHeartbeat();
  if (G.conn){ try { G.conn.close(); } catch(e){} G.conn = null; }
  if (G.peer){ try { G.peer.destroy(); } catch(e){} G.peer = null; }
}

function renderMenu(err){
  if (err !== undefined) menuError = err;
  showOverlay(menuHTML(menuError));

  overlay.querySelectorAll('[data-mode]').forEach(b => {
    b.onclick = () => { G.config.mode = b.dataset.mode; menuError = ''; renderMenu(); };
  });
  overlay.querySelectorAll('[data-style]').forEach(b => {
    b.onclick = () => { G.config.style = b.dataset.style; menuError = ''; renderMenu(); };
  });
  overlay.querySelectorAll('[data-size]').forEach(b => {
    b.onclick = () => { G.config.size = b.dataset.size; menuError = ''; renderMenu(); };
  });

  const btnStart = overlay.querySelector('#btnStart');
  if (btnStart) btnStart.onclick = () => { menuError = ''; startMatch(newSeed(), 'solo'); };

  const btnHost = overlay.querySelector('#btnHost');
  if (btnHost) btnHost.onclick = () => { menuError = ''; hostGame(); };

  const btnJoin = overlay.querySelector('#btnJoin');
  const joinRow = overlay.querySelector('#joinRow');
  const input   = overlay.querySelector('#joinInput');
  const btnGo   = overlay.querySelector('#btnJoinGo');

  if (btnJoin) btnJoin.onclick = () => {
    joinRow.classList.toggle('hidden');
    if (!joinRow.classList.contains('hidden') && input) input.focus();
  };
  if (btnGo) btnGo.onclick = () => {
    const code = (input.value || '').trim().toUpperCase();
    if (code.length !== 4){ menuError = 'Enter the 4-character room code.'; renderMenu(); return; }
    menuError = ''; joinGame(code);
  };
  if (input) input.onkeydown = e => { if (e.key === 'Enter') btnGo.click(); };
}

function waitHTML(icon, title, body){

    '<div class="big">' + icon + '</div>' +

function wireCancel(){
  const b = overlay.querySelector('#btnCancel');

function hostGame(){
  setStatus('CONNECTING', 'warn');
  showOverlay(waitHTML('📡', 'CREATING ROOM', '<span class="spin"></span>Setting up a peer connection…'));
  wireCancel();

  const code = makeCode();
  let peer;
  try { peer = new Peer(PREFIX + code, { debug: 0 }); }
  catch(e){ renderMenu('Could not start peer connection.'); return; }
  G.peer = peer;
  let started = false;

  peer.on('open', () => {
    if (G.peer !== peer) return;
    showCodeScreen(code);
    wireCancel();
  });
  peer.on('connection', c => {
    if (G.conn){ try { c.close(); } catch(e){} return; }
    attachConn(c);
    const begin = () => {
      if (started) return;
      started = true;
      const seedHost = newSeed();
      const seedGuest = newSeed();
      send({ t:'seed', seedHost, seedGuest, config: G.config });
      startMatch(seedHost, 'host', seedGuest);
    };
    c.on('open', begin);
    if (c.open) begin();
  });
  peer.on('error', err => {
    if (G.peer !== peer) return;
    cleanupNet();
    const t = err && err.type;
    if (t === 'unavailable-id') renderMenu('Room code collision — please try again.');
    else renderMenu('Connection error: ' + (t || 'unknown'));
  });
}

function showCodeScreen(code){
  setStatus('WAITING', 'warn');
  showOverlay(
    '<div class="ovbox">' +
      '<div class="big">🎮</div>' +
      '<h2>ROOM <span>READY</span></h2>' +
      '<p>Share this code with your opponent.<br>Tap the code to copy it.</p>' +
      '<div class="codebox"><div class="codeval" id="codeVal">' + code + '</div></div>' +
      '<p style="margin-top:12px"><span class="spin"></span>Waiting for opponent…</p>' +
      '<div class="ovbtns"><button class="ghost" id="btnCancel">CANCEL</button></div>' +
    '</div>'
  );
  const cv = overlay.querySelector('#codeVal');
  cv.onclick = () => {
    SFX.clickSoft();
    copyToClipboard(code).then(ok => {
      cv.textContent = ok ? 'COPIED' : code;
      setTimeout(() => { cv.textContent = code; }, 900);
    });
  };
  wireCancel();
}

function joinGame(code){
  setStatus('CONNECTING', 'warn');
  showOverlay(waitHTML('🔎', 'JOINING ' + code, '<span class="spin"></span>Looking for the room…'));
  wireCancel();
  let peer;
  try { peer = new Peer({ debug: 0 }); }
  catch(e){ renderMenu('Could not start peer connection.'); return; }
  G.peer = peer;
  let joined = false;

  peer.on('open', () => {
    if (G.peer !== peer) return;
    const c = peer.connect(PREFIX + code, { reliable: true });
    attachConn(c);
    c.on('open', () => {
      if (joined) return;
      joined = true;
      G.role = 'guest';
      setStatus('WAITING', 'warn');
      showOverlay(waitHTML('✅', 'CONNECTED', '<span class="spin"></span>Waiting for the host to start…'));
      wireCancel();
    });
  });
  peer.on('error', err => {
    if (G.peer !== peer) return;
    cleanupNet();
    const t = err && err.type;
    if (t === 'peer-unavailable') renderMenu('Room "' + code + '" was not found.');
    else renderMenu('Connection error: ' + (t || 'unknown'));
  });
}

/* ══════════════════════════════════════════════════════════════
   MATCH FLOW
   ══════════════════════════════════════════════════════════════ */
function startMatch(seed, role, seedGuest){
  G.role = role;
  G.seed = seed >>> 0;
  G.boardSeed = G.seed;
  G.mySeed = (role === 'guest') ? (G.mySeed || G.seed) : G.seed;
  G.theirSeed = (role === 'guest') ? (G.theirSeed || (seedGuest || G.seed)) : (seedGuest || G.seed);
  G.myOwner = (role === 'guest') ? 2 : 1;
  G.theirOwner = (role === 'guest') ? 1 : 2;
  G.lossPending = false; G.winSent = false; G.opponentGone = false;
  G.pendingDig = null; G.lastRecv = performance.now();
  G.deathTile = null; G.theirDeathTile = null;
  G.territoryUnlocked = false; G.reviewViews = [];
  heldPan.w = heldPan.a = heldPan.s = heldPan.d = false;

  const oldPop = document.querySelector('.terr-unlock');
  if (oldPop) oldPop.remove();

  const d = dimsFor(G.config);
  const mode = G.config.mode;
  let starts = [{ r: (d.rows >> 1), c: (d.cols >> 1) }];
  if (mode === 'territory') starts = territoryStarts(d.rows, d.cols);

  if (mode === 'territory'){
    const opening = starts.map(s => [s.r, s.c]);
    const res = generateSolvableBoard(
      G.mySeed, G.config.style, d.cols, d.rows, d.mines,
      undefined, undefined, starts, opening
    );
    G.board = res.board;
    G.boardSeed = res.seed;
    G.boardPending = false;
  } else {
    G.board = placeholderBoard(G.config.style, d.rows, d.cols);
    G.boardPending = true;
  }

  G.myBoard = makeBoardState(d.rows, d.cols);
  G.theirBoard = makeBoardState(d.rows, d.cols);
  G.theirBoardLayout = (mode === 'duel')
    ? placeholderBoard(G.config.style, d.rows, d.cols)
    : G.board;

  const myStart = starts.length > 1 ? starts[G.myOwner - 1] : starts[0];
  const theirStart = starts.length > 1 ? starts[G.theirOwner - 1] : starts[0];

  G.me = makePlayerState(myStart);
  G.them = (role === 'solo') ? null : makePlayerState(theirStart);

  buildArena();
  buildControls();
  hideOverlay();

  G.state = 'countdown';
  countdown(() => {
    G.state = 'playing';
    G.startTime = performance.now();
    lastCursorSent = 0;
    setStatus(role === 'solo' ? 'SOLO' : 'LIVE', 'live');
    SFX.go();
    if (mode === 'territory') revealTerritoryStart();
  });
}

function revealTerritoryStart(){
  if (!G.board || !G.myBoard) return;
  const d = dimsFor(G.config);
  const starts = territoryStarts(d.rows, d.cols);
  const myS = starts[G.myOwner - 1];
  const theirS = starts[G.theirOwner - 1];
  applyReveal(G.myBoard, G.board, myS.r, myS.c, G.myOwner);
  applyReveal(G.myBoard, G.board, theirS.r, theirS.c, G.theirOwner);
}

function countdown(done){
  let n = 3;
  const step = () => {
    if (n > 0){
      showOverlay('<div class="ovbox"><h2>GET <span>READY</span></h2><div class="cd">' + n + '</div></div>');
      SFX.countdown(n);
      n--;
      setTimeout(step, 750);
    } else {
      showOverlay('<div class="ovbox"><div class="cd" style="color:#5dff9e;text-shadow:0 0 34px #5dff9e,0 0 80px #5dff9e">GO!</div></div>');
      SFX.go();
      setTimeout(() => { hideOverlay(); done(); }, 550);
    }
  };
  step();
}

function buildControls(){
  controls.innerHTML = '';
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%';
  const leave = document.createElement('button');
  leave.className = 'danger';
  leave.textContent = 'LEAVE MATCH';
  leave.onclick = onLeaveClick;
  row.appendChild(leave);
  controls.appendChild(row);
  if (isMobileDevice()){
    controls.appendChild(buildTouchpad());
  }
}

async function onLeaveClick(){
  if (G.state === 'playing' || G.state === 'countdown'){
    const ok = await confirmDialog({
      title: 'LEAVE MATCH?',
      message: 'Your current match will be abandoned and your opponent will be disconnected.',
      ok: 'LEAVE', cancel: 'STAY'
    });
    if (!ok) return;
  }
  if (G.conn && G.conn.open && G.state !== 'lobby'){
    try { G.conn.send({ t:'bye' }); } catch(e){}
  }
  setTimeout(() => { cleanupNet(); idleOverlay(); }, 160);
}

function onRematchClick(){
  if (G.state !== 'over' && G.state !== 'playing') return;
  if (G.role === 'solo'){ startMatch(newSeed(), 'solo'); return; }
  if (G.role !== 'host') return;
  if (G.opponentGone){ idleOverlay(); return; }
  const seedHost = newSeed();
  const seedGuest = newSeed();
  send({ t:'seed', seedHost, seedGuest, config: G.config });
  startMatch(seedHost, 'host', seedGuest);
}

/* ══════════════════════════════════════════════════════════════
   MAP REVIEW
   ══════════════════════════════════════════════════════════════ */
function buildFullRevealState(baseState, board){
  const s = makeBoardState(board.rows, board.cols);
  for (let r = 0; r < board.rows; r++){
    for (let c = 0; c < board.cols; c++){
      s.revealed[r][c] = true;
      if (baseState.owner) s.owner[r][c] = baseState.owner[r][c];
    }
  }
  s.safeRevealed = board.safeCount;
  return s;
}
function buildEndReviewState(baseState, board, deathTile){
  const s = makeBoardState(board.rows, board.cols);
  for (let r = 0; r < board.rows; r++){
    for (let c = 0; c < board.cols; c++){
      const isMine = board.mines.has(r + ',' + c);
      const isDeath = deathTile && deathTile.r === r && deathTile.c === c;
      const rev = baseState.revealed[r][c] && (!isMine || isDeath);
      s.revealed[r][c] = rev;
      s.flagged[r][c]  = baseState.flagged[r][c];
      s.flagAt[r][c]   = 1;
      if (baseState.owner) s.owner[r][c] = baseState.owner[r][c];
      if (rev && !isMine) s.safeRevealed++;
    }
  }
  return s;
}

let reviewRafId = null;
function showMapReview(){
  if (!G.board || !G.myBoard) return;
  const isDuel = (G.config.mode === 'duel') && !!G.theirBoard;
  const myLayout = G.board;
  const theirLayout = (G.config.mode === 'duel') ? (G.theirBoardLayout || G.board) : G.board;

  const meEnd  = buildEndReviewState(G.myBoard, myLayout, G.deathTile);
  const meFull = buildFullRevealState(G.myBoard, myLayout);
  let themEnd = null, themFull = null;
  if (isDuel){
    themEnd  = buildEndReviewState(G.theirBoard, theirLayout, G.theirDeathTile);
    themFull = buildFullRevealState(G.theirBoard, theirLayout);
  }

  const cells =
    '<div class="review-cell">' +
      '<canvas data-review="me"></canvas>' +
      (isDuel ? '<div class="review-label me">YOU</div>' : '') +
    '</div>' +
    (isDuel
      ? '<div class="review-cell">' +
          '<canvas data-review="them"></canvas>' +
          '<div class="review-label them">OPPONENT</div>' +
        '</div>'
      : '');

  modal.innerHTML =
    '<div class="ovbox mapreview">' +
      '<h2>MAP <span>REVIEW</span></h2>' +
      '<div class="mapreview-canvas' + (isDuel ? ' two' : '') + '">' + cells + '</div>' +
      '<div class="mapreview-foot">' +
        '<button id="btnToggleView">SHOW FULL MAP</button>' +
        '<button class="ghost" id="btnResetView">RESET VIEW</button>' +
        '<button class="ghost" id="btnCloseReview">CLOSE</button>' +
      '</div>' +
    '</div>';
  modal.classList.remove('hidden');

  const vc = viewConfig();
  const views = [];
  modal.querySelectorAll('canvas[data-review]').forEach(c => {
    const v = new BoardView(c);
    v.setConfig(vc);
    bindCanvasInput(v, false);
    views.push(v);
  });
  G.reviewViews = views;

  let showingFull = false;
  const highlights = G.deathTile
    ? [{ r: G.deathTile.r, c: G.deathTile.c, color: '#ffe066' }]
    : [];

  const draw = (now) => {
    reviewRafId = requestAnimationFrame(draw);
    const t = now + 60000;
    if (views[0]){
      views[0].render(t, {
        board: myLayout,
        boardState: showingFull ? meFull : meEnd,
        cursors: [],
        highlights
      });
    }
    if (views[1]){
      views[1].render(t, {
        board: theirLayout,
        boardState: showingFull ? themFull : themEnd,
        cursors: [],
        highlights: []
      });
    }
  };
  reviewRafId = requestAnimationFrame(draw);

  const toggleBtn = modal.querySelector('#btnToggleView');
  toggleBtn.onclick = () => {
    showingFull = !showingFull;
    toggleBtn.textContent = showingFull ? 'SHOW END STATE' : 'SHOW FULL MAP';
    toggleBtn.classList.toggle('primary', showingFull);
  };
  modal.querySelector('#btnResetView').onclick = () => {
    views.forEach(v => v.resetView());
  };
  const closeReview = () => {
    if (reviewRafId){ cancelAnimationFrame(reviewRafId); reviewRafId = null; }
    views.forEach(v => v.destroy());
    G.reviewViews = [];
    modal.classList.add('hidden');
    modal.innerHTML = '';
    document.removeEventListener('keydown', onKey);
  };
  const onKey = e => { if (e.key === 'Escape') closeReview(); };
  modal.querySelector('#btnCloseReview').onclick = closeReview;
  modal.addEventListener('click', e => { if (e.target === modal) closeReview(); });
  document.addEventListener('keydown', onKey);
}

/* ══════════════════════════════════════════════════════════════
   END GAME
   ══════════════════════════════════════════════════════════════ */
function endGame(result, icon, title, sub, elapsed, cards){
  if (G.state === 'over') return;
  G.state = 'over';
  if (G.me) G.me.done = true;
  heldPan.w = heldPan.a = heldPan.s = heldPan.d = false;

  const statusMap = {
    win:        ['VICTORY', 'live'],
    lose:       ['DEFEAT', 'bad'],
    draw:       ['DRAW', 'warn'],
    disconnect: ['DISCONNECTED', 'bad']
  };
  const s = statusMap[result] || ['MATCH OVER', 'warn'];
  setStatus(s[0], s[1]);

  const secs = Math.max(0, elapsed) / 1000;
  let cardsHtml = cards;
  if (!cardsHtml){
    cardsHtml =
      '<div class="statcard"><div class="slabel">TIME</div><div class="sval">' + secs.toFixed(1) + '</div></div>' +
      '<div class="statcard"><div class="slabel">YOUR HITS</div><div class="sval">' + (G.me ? G.me.hits : 0) + '</div></div>';
    if (G.them){
      cardsHtml += '<div class="statcard lose"><div class="slabel">THEIR HITS</div><div class="sval">' + G.them.hits + '</div></div>';
    }
  }

  const canRematch = (G.role === 'solo') || (G.role === 'host' && !G.opponentGone);
  const canReview  = !!G.board && !!G.myBoard;

  showOverlay(
    '<div class="ovbox">' +
      '<div class="big">' + icon + '</div>' +
      '<h2>' + title + '</h2>' +
      '<p>' + sub + '</p>' +
      '<div class="statrow">' + cardsHtml + '</div>' +
      '<div class="ovbtns">' +
        (canRematch ? '<button class="primary" id="btnAgain">REMATCH</button>' : '') +
        (canReview ? '<button id="btnReview">VIEW MAP</button>' : '') +
        '<button class="ghost" id="btnMenu">MAIN MENU</button>' +
      '</div>' +
      (G.role === 'guest' && !G.opponentGone ? '<div class="err">Waiting for the host to start a rematch…</div>' : '') +
      (G.opponentGone ? '<div class="err">Opponent disconnected.</div>' : '') +
    '</div>'
  );

  const again = overlay.querySelector('#btnAgain');
  if (again) again.onclick = () => {
    if (G.role === 'solo'){ startMatch(newSeed(), 'solo'); return; }
    const seedHost = newSeed();
    const seedGuest = newSeed();
    send({ t:'seed', seedHost, seedGuest, config: G.config });
    startMatch(seedHost, 'host', seedGuest);
  };
  const review = overlay.querySelector('#btnReview');
  if (review) review.onclick = () => showMapReview();
  overlay.querySelector('#btnMenu').onclick = () => { cleanupNet(); idleOverlay(); };

  if (result === 'win') SFX.win();
  else if (result === 'lose' || result === 'disconnect') SFX.lose();
}

/* ══════════════════════════════════════════════════════════════
   RENDER LOOP
   ══════════════════════════════════════════════════════════════ */
function renderAll(now){
  if (!G.viewMe || !G.myBoard || !G.board || !G.me) return;
  const myColor = '#4dd8ff';
  const cursors = [{ r: G.me.cursor.r, c: G.me.cursor.c, color: myColor }];
  G.viewMe.render(now, { board: G.board, boardState: G.myBoard, cursors });

  if (G.viewThem && G.theirBoard){
    const layout = (G.config.mode === 'duel')
      ? (G.theirBoardLayout || G.board)
      : G.board;
    G.viewThem.render(now, {
      board: layout,
      boardState: G.theirBoard,
      cursors: []
    });
  }
  updateHUD(now);
}

function updateHUD(now){
  if (!G.board || !G.myBoard || !G.me) return;
  const mode = G.config.mode;
  const bs = G.myBoard;
  const elapsed = (G.state === 'playing' || G.state === 'over')
    ? Math.max(0, now - G.startTime) : 0;

  const els = G.panelMe && G.panelMe._els;
  if (els){
    if (mode === 'territory'){
      const mine   = countLand(bs, G.myOwner);
      const theirs = countLand(bs, G.theirOwner);
      const total  = Math.max(1, mine + theirs);
      setText(els.myLand, mine);
      setText(els.theirLand, theirs);
      setText(els.time, (elapsed / 1000).toFixed(1));
      if (els.myBar)    els.myBar.style.width    = (mine / total * 100).toFixed(1) + '%';
      if (els.theirBar) els.theirBar.style.width = (theirs / total * 100).toFixed(1) + '%';
    } else {
      setText(els.mines, Math.max(0, G.board.mineCount - bs.flagCount));
      setText(els.time, (elapsed / 1000).toFixed(1));
      setText(els.hits, G.me.hits);
      if (els.bar) els.bar.style.width = (bs.safeRevealed / Math.max(1, G.board.safeCount) * 100).toFixed(1) + '%';
    }
    if (els.stun){
      const rem = G.me.stunUntil - now;
      if (rem > 0 && G.state === 'playing'){
        els.stun.classList.add('on');
        setStunFace(els.stun, G.me.stunReason);
        setText(els.stun.querySelector('[data-timer]'), (rem / 1000).toFixed(1));
      } else {
        els.stun.classList.remove('on');
      }
    }
    if (els.oppStun){
      const rem = G.them ? (G.them.stunUntil - now) : 0;
      if (rem > 0 && G.state === 'playing'){
        const ice = G.them && G.them.stunReason === 'flag';
        els.oppStun.classList.add('on');
        els.oppStun.classList.toggle('ice', !!ice);
        const oe = els.oppStun.querySelector('[data-oemoji]');
        if (oe) setText(oe, ice ? '❄️' : '💥');
        setText(els.oppStun.querySelector('b'), (rem / 1000).toFixed(1));
      } else {
        els.oppStun.classList.remove('on');
      }
    }
  }
  if (G.panelThem && G.panelThem._els && G.theirBoard){
    const layout = (G.config.mode === 'duel') ? (G.theirBoardLayout || G.board) : G.board;
    const te = G.panelThem._els;
    setText(te.mines, Math.max(0, (layout ? layout.mineCount : 0) - G.theirBoard.flagCount));
    setText(te.time, (elapsed / 1000).toFixed(1));
    setText(te.hits, G.them ? G.them.hits : 0);
    if (te.bar && layout) {
      te.bar.style.width = (G.theirBoard.safeRevealed / Math.max(1, layout.safeCount) * 100).toFixed(1) + '%';
    }
    if (te.stun){
      const rem = G.them ? (G.them.stunUntil - now) : 0;
      if (rem > 0 && G.state === 'playing'){
        te.stun.classList.add('on');
        setStunFace(te.stun, G.them ? G.them.stunReason : 'bomb');
        setText(te.stun.querySelector('[data-timer]'), (rem / 1000).toFixed(1));
      } else {
        te.stun.classList.remove('on');
      }
    }
  }
}

let lastFrameTime = 0;
function loop(now){
  requestAnimationFrame(loop);
  if (!lastFrameTime) lastFrameTime = now;
  const elapsed = now - lastFrameTime;
  if (elapsed < FRAME_MIN_MS) return;
  lastFrameTime = now - (elapsed % FRAME_MIN_MS);
  const dt = Math.min(elapsed, 100);
  try { updatePanFromKeys(dt); } catch(e){}
  try { renderAll(now); } catch(e){}
}
requestAnimationFrame(loop);

/* ══════════════════════════════════════════════════════════════
   WINDOW EVENTS
   ══════════════════════════════════════════════════════════════ */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!G.viewMe) return;
    const vc = viewConfig();
    try {
      G.viewMe.setConfig(vc, true);
      if (G.viewThem) G.viewThem.setConfig(vc, true);
    } catch(e){}
    if (G.reviewViews && G.reviewViews.length){
      for (const v of G.reviewViews) {
        try { v.setConfig(vc, true); } catch(e){}
      }
    }
  }, 120);
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => window.dispatchEvent(new Event('resize')), 260);
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => {
  if (e.target && e.target.tagName === 'CANVAS') e.preventDefault();
}, { passive:false });
window.addEventListener('pointerdown', function unlock(){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch(e){}
  window.removeEventListener('pointerdown', unlock);
}, { once:true });
window.addEventListener('beforeunload', e => {
  if (G.conn && G.conn.open && G.state !== 'lobby'){
    try { G.conn.send({ t:'bye' }); } catch(err){}
  }
  if (G.state === 'playing' || G.state === 'countdown'){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
window.addEventListener('pagehide', () => {
  if (G.conn && G.conn.open && G.state !== 'lobby'){
    try { G.conn.send({ t:'bye' }); } catch(err){}
  }
});

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
idleOverlay();

})();
</script>
